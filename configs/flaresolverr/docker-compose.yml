services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: Asia/Riyadh
    ports:
      - "192.168.1.207:8191:8191"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
