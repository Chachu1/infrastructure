name: Deploy App

# Per-service immutable-release deploys triggered from the Price Tracker repo
# via a repository_dispatch event:
#
#   gh api -X POST repos/Chachu1/infrastructure/dispatches \
#     -F event_type=deploy-app \
#     -F "client_payload[service]=categorizer" \
#     -F "client_payload[sha]=<commit-sha>"
#
# Only allowlisted services may be deployed; the SHA is validated as a git
# commit hash before anything runs. Per-service secrets are injected as env
# vars on the Ansible step and read by playbooks/deploy/vars/<service>.yml
# via lookup('env', ...). They are no_log in Ansible.

on:
  repository_dispatch:
    types: [deploy-app]

permissions:
  contents: read

concurrency:
  group: deploy-app-${{ github.event.client_payload.service }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, proxmox]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup SSH Key
        run: |
          mkdir -p /home/runner/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /home/runner/.ssh/id_ed25519
          chmod 600 /home/runner/.ssh/id_ed25519
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/.ssh/id_ed25519.pub
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > /home/runner/.ssh/proxmox_key
          chmod 600 /home/runner/.ssh/proxmox_key

      - name: Validate payload
        id: validate
        run: |
          SERVICE="${{ github.event.client_payload.service }}"
          SHA="${{ github.event.client_payload.sha }}"
          case "$SERVICE" in
            categorizer|review-api|enrichment-worker|pdp-enricher|local-scraper|screenshot-service|job-tracker-api|dashboard-api|transform-worker|backfill-ui|frontend|pg-backup)
              ;;
            *)
              echo "::error::service '$SERVICE' not in allowlist"
              exit 1
              ;;
          esac
          if ! echo "$SHA" | grep -qE '^[0-9a-f]{7,40}$'; then
            echo "::error::sha '$SHA' is not a valid git commit hash"
            exit 1
          fi
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Run Ansible deploy
        id: deploy
        working-directory: ansible
        run: ansible-playbook playbooks/deploy.yml -e service=${{ steps.validate.outputs.service }} -e sha=${{ steps.validate.outputs.sha }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          # Token to clone the private Price_Tracker repo from the LXC.
          # Create a fine-grained PAT scoped to Chachu1/Price_Tracker
          # (Contents: Read) and add as PRICE_TRACKER_PAT in this repo.
          PRICE_TRACKER_PAT: ${{ secrets.PRICE_TRACKER_PAT }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # App secrets are read by playbooks/deploy/vars/<service>.yml via
          # lookup('env', ...). PG_DSN is the single Postgres DSN for all
          # services (10.0.0.20). Per-service DSN secrets removed.
          PG_DSN: ${{ secrets.PG_DSN }}
          OPENROUTER_CATEGORIZER_KEY: ${{ secrets.OPENROUTER_CATEGORIZER_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          REVIEW_API_BEARER_TOKEN: ${{ secrets.REVIEW_API_BEARER_TOKEN }}
          # Secrets consumed by the new migrated services (deploy/vars/*.yml).
          # Missing secrets resolve to empty strings via lookup('env', ..., default='').
          JOB_TRACKER_API_TOKEN: ${{ secrets.JOB_TRACKER_API_TOKEN }}
          OPENROUTER_ENRICHMENT_KEY: ${{ secrets.OPENROUTER_ENRICHMENT_KEY }}
          OPENROUTER_QUALITY_KEY: ${{ secrets.OPENROUTER_QUALITY_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Least-privilege AWS credentials, scoped per service (deploy/vars/*.yml).
          LOCAL_SCRAPER_AWS_ACCESS_KEY_ID: ${{ secrets.LOCAL_SCRAPER_AWS_ACCESS_KEY_ID }}
          LOCAL_SCRAPER_AWS_SECRET_ACCESS_KEY: ${{ secrets.LOCAL_SCRAPER_AWS_SECRET_ACCESS_KEY }}
          ENRICHMENT_WORKER_AWS_ACCESS_KEY_ID: ${{ secrets.ENRICHMENT_WORKER_AWS_ACCESS_KEY_ID }}
          ENRICHMENT_WORKER_AWS_SECRET_ACCESS_KEY: ${{ secrets.ENRICHMENT_WORKER_AWS_SECRET_ACCESS_KEY }}
          PDP_ENRICHER_AWS_ACCESS_KEY_ID: ${{ secrets.PDP_ENRICHER_AWS_ACCESS_KEY_ID }}
          PDP_ENRICHER_AWS_SECRET_ACCESS_KEY: ${{ secrets.PDP_ENRICHER_AWS_SECRET_ACCESS_KEY }}
          SCREENSHOT_SERVICE_AWS_ACCESS_KEY_ID: ${{ secrets.SCREENSHOT_SERVICE_AWS_ACCESS_KEY_ID }}
          SCREENSHOT_SERVICE_AWS_SECRET_ACCESS_KEY: ${{ secrets.SCREENSHOT_SERVICE_AWS_SECRET_ACCESS_KEY }}
          TRANSFORM_WORKER_AWS_ACCESS_KEY_ID: ${{ secrets.TRANSFORM_WORKER_AWS_ACCESS_KEY_ID }}
          TRANSFORM_WORKER_AWS_SECRET_ACCESS_KEY: ${{ secrets.TRANSFORM_WORKER_AWS_SECRET_ACCESS_KEY }}
          JOB_TRACKER_API_AWS_ACCESS_KEY_ID: ${{ secrets.JOB_TRACKER_API_AWS_ACCESS_KEY_ID }}
          JOB_TRACKER_API_AWS_SECRET_ACCESS_KEY: ${{ secrets.JOB_TRACKER_API_AWS_SECRET_ACCESS_KEY }}
          # Email + region for job-tracker-api notifications. Stored in GitHub
          # as either secrets or variables; fall back across both.
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL || vars.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || vars.RECIPIENT_EMAIL }}
          AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
          PG_BACKUP_AWS_ACCESS_KEY_ID: ${{ secrets.PG_BACKUP_AWS_ACCESS_KEY_ID }}
          PG_BACKUP_AWS_SECRET_ACCESS_KEY: ${{ secrets.PG_BACKUP_AWS_SECRET_ACCESS_KEY }}
          # Shared infra secrets (same set the site.yml ansible job uses).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WIREGUARD_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          POSTGRES_MOHSIN_PASSWORD: ${{ secrets.POSTGRES_MOHSIN_PASSWORD }}
          POSTGRES_PRICETRACKER_PASSWORD: ${{ secrets.POSTGRES_PRICETRACKER_PASSWORD }}

      - name: Get service logs on failure
        if: steps.deploy.outcome == 'failure'
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible ${{ steps.validate.outputs.service }} -m shell -a 'journalctl -u ${{ steps.validate.outputs.service }} --no-pager -n 100'