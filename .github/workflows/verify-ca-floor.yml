name: Verify CA floor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, proxmox]
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH Key
        run: |
          mkdir -p /home/runner/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /home/runner/.ssh/id_ed25519
          chmod 600 /home/runner/.ssh/id_ed25519
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/.ssh/id_ed25519.pub

      - name: Check uv and certifi on app hosts
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible 'categorizer:review-api:job-tracker-api:dashboard-api:backfill-ui:screenshot-service:transform-worker:enrichment-worker:pdp-enricher:local-scraper:carrefour-scraper' \
            -m shell \
            -a 'svc=$(hostname); uv=$(/usr/local/bin/uv --version 2>/dev/null | cut -d" " -f2); p=/opt/$svc/current/venv/bin/python; if [ -x "$p" ]; then cert=$($p -c "import certifi; print(certifi.__version__)" 2>/dev/null || echo missing); else cert=no-venv; fi; echo "RESULT $svc uv=$uv certifi=$cert"' \
            2>&1 | grep -E 'RESULT|UNREACHABLE|failed=' || true
