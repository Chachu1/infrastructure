name: Diagnose Service

# Ad-hoc inspection of a deployed app host: systemd status + journal tail.
# Manual only. Example:
#   gh workflow run diagnose-service.yml -f service=carrefour-scraper -f lines=300

on:
  workflow_dispatch:
    inputs:
      service:
        description: Inventory host / systemd service to inspect
        required: true
        default: carrefour-scraper
      lines:
        description: journalctl lines to tail
        required: false
        default: "200"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, proxmox]
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH Key
        run: |
          mkdir -p /home/runner/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /home/runner/.ssh/id_ed25519
          chmod 600 /home/runner/.ssh/id_ed25519
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/.ssh/id_ed25519.pub

      - name: Inspect service
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          SVC="${{ inputs.service }}"
          LINES="${{ inputs.lines }}"
          echo "=== systemctl status ${SVC} ==="
          ansible "$SVC" -m shell -a "systemctl status ${SVC} --no-pager -l || true" 2>&1 | tail -n 80
          echo
          echo "=== journalctl -u ${SVC} -n ${LINES} ==="
          ansible "$SVC" -m shell -a "journalctl -u ${SVC} -n ${LINES} --no-pager || true" 2>&1 | tail -n 400

      - name: AWS credential fingerprint (masked)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible 'carrefour-scraper:local-scraper' -m shell -a 'svc=$(hostname); envf=/etc/$svc/env; echo "== $svc =="; grep -E "^AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)=" "$envf" | awk -F= "{v=\$2; printf \"%s len=%d last4=%s\n\", \$1, length(v), substr(v,length(v)-3)}"' 2>&1 | tail -n 20

      - name: AWS credential live test
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible 'carrefour-scraper:local-scraper' -m shell -a 'svc=$(hostname); echo "== $svc =="; set -a; . /etc/$svc/env; set +a; P=/opt/$svc/current/venv/bin/python; $P -c "import boto3; print(\"STS\", boto3.client(\"sts\", region_name=\"us-east-1\").get_caller_identity()[\"Arn\"])"; $P -c "import boto3; print(\"SQS\", list(boto3.client(\"sqs\", region_name=\"us-east-1\").list_queues().get(\"QueueUrls\", []))[:2])"' 2>&1 | tail -n 20
