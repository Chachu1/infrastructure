name: Maintenance

# Weekly OS maintenance for app hosts (Sunday 03:00 UTC) - also triggerable
# manually via workflow_dispatch. Runs ansible/playbooks/maintenance.yml
# against the lxc_apps + vm_apps groups, one host at a time. The gateway and
# Proxmox host are excluded so apt upgrades never disrupt Caddy/WireGuard.

on:
  schedule:
    - cron: '0 3 * * 0'  # Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: [self-hosted, proxmox]

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup SSH Key
        run: |
          mkdir -p /home/runner/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /home/runner/.ssh/id_ed25519
          chmod 600 /home/runner/.ssh/id_ed25519
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/.ssh/id_ed25519.pub
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > /home/runner/.ssh/proxmox_key
          chmod 600 /home/runner/.ssh/proxmox_key

      - name: Run Ansible maintenance playbook
        working-directory: ansible
        run: ansible-playbook playbooks/maintenance.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WIREGUARD_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          POSTGRES_MOHSIN_PASSWORD: ${{ secrets.POSTGRES_MOHSIN_PASSWORD }}
          POSTGRES_PRICETRACKER_PASSWORD: ${{ secrets.POSTGRES_PRICETRACKER_PASSWORD }}