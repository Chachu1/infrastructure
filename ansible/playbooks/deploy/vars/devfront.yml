---
# Per-service vars for devfront (used by playbooks/deploy.yml).
# Mirrors playbooks/hosts/devfront.yml - keep both in sync.
# Feature-branch preview; never point this at main by accident.

app_name: devfront
app_user: devfront
app_group: devfront
app_port: 3000
app_health_path: /login
app_health_port: 3000
app_health_check: "http"
app_runtime: "node"
app_node_dir: "frontend"
app_archive_paths: ["frontend"]
app_working_dir: "/opt/devfront/current/frontend"
app_repo_url: "https://github.com/Chachu1/Price_Tracker.git"
app_branch: feat/pipeline-dispatch-detail
app_keep_releases: 2
app_service_exec: "/usr/bin/npx next start -p 3000 -H 0.0.0.0"
app_env_vars:
  NODE_ENV: production
  APP_PORT: "3000"
  BETTER_AUTH_URL: "https://devfront.mhlab.me"
  DASHBOARD_API_URL: "http://10.0.0.78:8002"
app_secrets:
  PG_DSN: "{{ lookup('env', 'PG_DSN', default='') }}"
  BETTER_AUTH_SECRET: "{{ lookup('env', 'BETTER_AUTH_SECRET', default='') }}"
  PT_INTERNAL_SECRET: "{{ lookup('env', 'PT_INTERNAL_SECRET', default='') }}"
  DASHBOARD_SERVICE_TOKEN: "{{ lookup('env', 'DASHBOARD_SERVICE_TOKEN', default='') }}"
