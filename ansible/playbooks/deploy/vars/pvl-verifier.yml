---
# Per-service vars for pvl-verifier (used by playbooks/deploy.yml).
# Native LXC + system Chromium (no Docker). Mirrors hosts/pvl-verifier.yml.
# Internal worker (no HTTP listener); health checked via systemd active.

app_name: pvl-verifier
app_user: pvl-verifier
app_group: pvl-verifier
app_port: 8000
app_health_path: /health
app_health_port: 8000
app_health_check: "systemd"
app_browser: true
app_working_dir: "/opt/pvl-verifier/current/services/pvl-verifier"
app_requirements: "services/pvl-verifier/requirements.txt"
app_repo_url: "https://github.com/Chachu1/Price_Tracker.git"
app_branch: main
app_keep_releases: 3
app_service_exec: "/opt/pvl-verifier/current/venv/bin/python -u worker.py"
app_env_vars:
  APP_ENV: production
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_REGION: "us-east-1"
  PVL_PROOF_BUCKET: "price-tracker-screenshots-751626788293-us-east-1"
  PVL_PROOF_PREFIX: "screenshots/price-proof/"
  PVL_EVIDENCE_BUCKET: "price-tracker-screenshots-751626788293-us-east-1"
  PVL_EVIDENCE_PREFIX: "screenshots/price-proof/"
  PDP_DATA_BUCKET: "price-tracker-data-751626788293-us-east-1"
  PVL_POLL_SECONDS: "15"
  PVL_BATCH_SIZE: "5"
  PVL_WORKER_NAME: "pvl-verifier"
  # Local FlareSolverr (provisioned on this LXC; see hosts/pvl-verifier.yml).
  # Swas/Lulu/Carrefour are challenge-protected past what an IP change solves.
  PVL_FLARESOLVERR_URL: "http://127.0.0.1:8191"
  PVL_FLARESOLVERR_RETAILERS: "Carrefour%,Swas,Lulu"
  PVL_FLARESOLVERR_TIMEOUT_MS: "120000"
  PVL_FLARESOLVERR_WAIT_SECONDS: "2"
  # Proxy pool for retailers where residential egress is enough (SharafDG,
  # Emax). No-auth SOCKS5: Chromium cannot do SOCKS auth.
  PVL_PROXY_NODES: "socks5://192.168.1.207:1080"
  PVL_PROXY_RETAILERS: "SharafDG,Emax"
  PVL_PROXY_STRATEGY: "sticky"
  PVL_PROXY_FAILOVER: "true"
  PVL_PROXY_COOLDOWN_SECONDS: "300"
  # Two engines' worst-case timeouts exceed the old 600s lease.
  PVL_LEASE_SECONDS: "1800"
  # Carrefour stays on the headed LXC until its FlareSolverr smoke test passes.
  PVL_EXCLUDE_CARREFOUR: "true"
app_secrets:
  PG_DSN: "{{ lookup('env', 'PG_DSN') }}"
  # The evidence bundle (proof PNG + HTML) lives in the screenshots bucket
  # under its allowed prefix, so the screenshot-service principal is used for
  # both the default session and the explicit proof client.
  AWS_ACCESS_KEY_ID: "{{ lookup('env', 'SCREENSHOT_SERVICE_AWS_ACCESS_KEY_ID', default='') }}"
  AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'SCREENSHOT_SERVICE_AWS_SECRET_ACCESS_KEY', default='') }}"
  PVL_PROOF_AWS_ACCESS_KEY_ID: "{{ lookup('env', 'SCREENSHOT_SERVICE_AWS_ACCESS_KEY_ID', default='') }}"
  PVL_PROOF_AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'SCREENSHOT_SERVICE_AWS_SECRET_ACCESS_KEY', default='') }}"
