---
# Per-service vars for frontend (used by playbooks/deploy.yml).
# Native Node LXC (no Docker): npm ci && npm run build, then `next start`.
# Mirrors hosts/frontend.yml.

app_name: frontend
app_user: frontend
app_group: frontend
app_port: 3000
# Better Auth redirects anonymous visitors from / to /login, so health-check
# the login page (the deploy playbook requires HTTP 200).
app_health_path: /login
app_health_port: 3000
app_health_check: "http"
app_runtime: "node"
app_node_dir: "frontend"
app_archive_paths: ["frontend"]
app_working_dir: "/opt/frontend/current/frontend"
app_repo_url: "https://github.com/Chachu1/Price_Tracker.git"
app_branch: main
app_keep_releases: 2
app_service_exec: "/usr/bin/npx next start -p 3000 -H 0.0.0.0"
app_env_vars:
  NODE_ENV: production
  APP_PORT: "3000"
  BETTER_AUTH_URL: "https://frontend.mhlab.me"
  DASHBOARD_API_URL: "http://10.0.0.64:8002"
app_secrets:
  # Better Auth session storage (user/session/account/verification).
  # Least-privilege role: DML on the auth/audit tables only.
  PG_DSN: "{{ lookup('env', 'FRONTEND_PG_DSN', default='') }}"
  BETTER_AUTH_SECRET: "{{ lookup('env', 'BETTER_AUTH_SECRET', default='') }}"
  # HS256 key for the 60s X-PT-Identity claim; must match dashboard-api.
  PT_INTERNAL_SECRET: "{{ lookup('env', 'PT_INTERNAL_SECRET', default='') }}"
  # Transport bearer for the /api/data and /api/admin BFF hops.
  DASHBOARD_SERVICE_TOKEN: "{{ lookup('env', 'DASHBOARD_SERVICE_TOKEN', default='') }}"
