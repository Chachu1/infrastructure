---
# Per-service vars for job-tracker-api (used by playbooks/deploy.yml).
# Mirrors playbooks/hosts/job-tracker-api.yml - keep both in sync.

app_name: job-tracker-api
app_user: job-tracker-api
app_group: job-tracker-api
app_port: 8001
app_health_path: /health
app_health_port: 8001
app_health_check: "http"
app_working_dir: "/opt/job-tracker-api/current/services/job-tracker-api"
app_requirements: "services/job-tracker-api/requirements.txt"
app_repo_url: "https://github.com/Chachu1/Price_Tracker.git"
app_branch: main
app_keep_releases: 3
app_service_exec: "/opt/job-tracker-api/current/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8001"
app_env_vars:
  APP_ENV: production
  APP_PORT: "8001"
  SCHEDULER_ENABLED: "true"
  JOB_TRACKER_URL: "http://job-tracker-api:8001"
  AWS_REGION: "{{ lookup('env', 'AWS_REGION', default='us-east-1') }}"
  AWS_DEFAULT_REGION: "{{ lookup('env', 'AWS_REGION', default='us-east-1') }}"
  SENDER_EMAIL: "{{ lookup('env', 'SENDER_EMAIL', default='') }}"
  RECIPIENT_EMAIL: "{{ lookup('env', 'RECIPIENT_EMAIL', default='') }}"
  SQS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/751626788293/price-tracker-scraper-queue"
  LOCAL_SCRAPE_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/751626788293/price-tracker-local-scrape-queue"
  CARREFOUR_SCRAPE_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/751626788293/price-tracker-carrefour-scrape-queue"
  # Matcher V3 (standalone GPU container on the LAN). The legacy v1 matcher
  # trigger must stay disabled. MATCHER_V3_MIN_COMPLETED_AT suppresses the
  # historical pipeline_runs backlog on (re-)enable; the scheduler also gates
  # on the last successful run in code.
  MATCHER_TRIGGER_ENABLED: "false"
  MATCHER_V3_ENABLED: "true"
  MATCHER_V3_DRY_RUN: "false"
  MATCHER_V3_API_URL: "http://192.168.1.171:8010"
  MATCHER_V3_HTTP_TIMEOUT_S: "3600"
  MATCHER_V3_MIN_COMPLETED_AT: "2026-09-16T10:45:00Z"
app_secrets:
  PG_DSN: "{{ lookup('env', 'PG_DSN') }}"
  API_BEARER_TOKEN: "{{ lookup('env', 'JOB_TRACKER_API_TOKEN', default='') }}"
  AWS_ACCESS_KEY_ID: "{{ lookup('env', 'JOB_TRACKER_API_AWS_ACCESS_KEY_ID', default='') }}"
  AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'JOB_TRACKER_API_AWS_SECRET_ACCESS_KEY', default='') }}"
  MATCHER_V3_API_TOKEN: "{{ lookup('env', 'MATCHER_V3_API_TOKEN', default='') }}"
