---
# Per-service vars for categorizer (used by playbooks/deploy.yml).
# Mirrors playbooks/hosts/categorizer.yml - keep both in sync.

app_name: categorizer
app_user: categorizer
app_group: categorizer
app_port: 8000
app_health_path: /health
app_health_port: 8000
app_health_check: "systemd"
app_working_dir: "/opt/categorizer/current/services/categorizer"
app_requirements: "services/categorizer/requirements.txt"
app_repo_url: "https://github.com/Chachu1/Price_Tracker.git"
app_branch: main
app_keep_releases: 3
app_service_exec: "/opt/categorizer/current/venv/bin/python -u worker.py"
app_env_vars:
  APP_ENV: production
  APP_PORT: "8000"
  MODE: "continuous"
  BATCH_SIZE: "100"
  POLL_INTERVAL_SECONDS: "30"
# Secrets are injected from GitHub Actions env at deploy time. Add/rename keys
# here to match the app's needs; empty values are written verbatim.
app_secrets:
  PG_DSN: "{{ lookup('env', 'PG_DSN') }}"
  OPENROUTER_CATEGORIZER_KEY: "{{ lookup('env', 'OPENROUTER_CATEGORIZER_KEY', default='') }}"
  OPENROUTER_MODEL: "{{ lookup('env', 'OPENROUTER_MODEL', default='') }}"