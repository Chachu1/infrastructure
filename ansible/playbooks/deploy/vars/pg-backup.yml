---
# Per-service vars for pg-backup (used by playbooks/deploy.yml).
# Native LXC: runs services/pg-backup/backup.sh on a loop. Mirrors hosts/pg-backup.yml.

app_name: pg-backup
app_user: pg-backup
app_group: pg-backup
app_port: 8000
app_health_path: /health
app_health_port: 8000
app_health_check: "systemd"
app_runtime: "script"
app_working_dir: "/opt/pg-backup/current/services/pg-backup"
app_requirements: "services/pg-backup/requirements.txt"
app_repo_url: "https://github.com/Chachu1/Price_Tracker.git"
app_branch: main
app_keep_releases: 3
app_service_exec: "/bin/bash -c 'while true; do /usr/bin/bash /opt/pg-backup/current/services/pg-backup/backup.sh; echo \"[pg-backup] sleeping ${BACKUP_INTERVAL_SECONDS:-86400}s\"; sleep ${BACKUP_INTERVAL_SECONDS:-86400}; done'"
app_env_vars:
  APP_ENV: production
  BACKUP_INTERVAL_SECONDS: "86400"
  AWS_DEFAULT_REGION: "us-east-1"
  S3_BUCKET: "coolify-backups-s3-price-tracker"
  S3_PATH_PREFIX: "backups/postgres"
app_secrets:
  PG_DSN: "{{ lookup('env', 'PG_DSN') }}"
  AWS_ACCESS_KEY_ID: "{{ lookup('env', 'PG_BACKUP_AWS_ACCESS_KEY_ID', default='') }}"
  AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'PG_BACKUP_AWS_SECRET_ACCESS_KEY', default='') }}"
