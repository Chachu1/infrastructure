---
# Per-service vars for enrichment-worker (used by playbooks/deploy.yml).
# Native LXC + system Chromium (no Docker). Mirrors hosts/enrichment-worker.yml.

app_name: enrichment-worker
app_user: enrichment-worker
app_group: enrichment-worker
app_port: 8000
app_health_path: /health
app_health_port: 8000
app_health_check: "systemd"
app_browser: true
app_working_dir: "/opt/enrichment-worker/current/services/enrichment-worker"
app_requirements: "services/enrichment-worker/requirements.txt"
app_repo_url: "https://github.com/Chachu1/Price_Tracker.git"
app_branch: main
app_keep_releases: 3
app_service_exec: "/opt/enrichment-worker/current/venv/bin/python -u worker.py"
app_env_vars:
  APP_ENV: production
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_REGION: "us-east-1"
  PDP_DATA_BUCKET: "price-tracker-data-751626788293-us-east-1"
  JT_POLL_INTERVAL: "15"
  JOB_TRACKER_URL: "http://job-tracker-api:8001"
app_secrets:
  PG_DSN: "{{ lookup('env', 'PG_DSN') }}"
  JOB_TRACKER_API_TOKEN: "{{ lookup('env', 'JOB_TRACKER_API_TOKEN', default='') }}"
  AWS_ACCESS_KEY_ID: "{{ lookup('env', 'ENRICHMENT_WORKER_AWS_ACCESS_KEY_ID', default='') }}"
  AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'ENRICHMENT_WORKER_AWS_SECRET_ACCESS_KEY', default='') }}"
  OPENROUTER_ENRICHMENT_KEY: "{{ lookup('env', 'OPENROUTER_ENRICHMENT_KEY', default='') }}"
