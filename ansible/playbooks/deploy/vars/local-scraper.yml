---
# Per-service vars for local-scraper (used by playbooks/deploy.yml).
# Native LXC + system Chromium (no Docker). Mirrors hosts/local-scraper.yml.

app_name: local-scraper
app_user: local-scraper
app_group: local-scraper
app_port: 8000
app_health_path: /health
app_health_port: 8000
app_health_check: "systemd"
app_browser: true
app_working_dir: "/opt/local-scraper/current/coolify/local-scraper"
app_requirements: "coolify/local-scraper/requirements.txt"
app_repo_url: "https://github.com/Chachu1/Price_Tracker.git"
app_branch: main
app_keep_releases: 3
app_service_exec: "/opt/local-scraper/current/venv/bin/python -u worker.py"
app_env_vars:
  APP_ENV: production
  JT_POLL_INTERVAL: "15"
  JOB_TRACKER_URL: "http://job-tracker-api:8001"
  LOCAL_SCRAPE_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/751626788293/price-tracker-local-scrape-queue"
  SCRAPED_DATA_BUCKET: "price-tracker-scraped-data"
app_secrets:
  PG_DSN: "{{ lookup('env', 'PG_DSN') }}"
  JOB_TRACKER_API_TOKEN: "{{ lookup('env', 'JOB_TRACKER_API_TOKEN', default='') }}"
  AWS_ACCESS_KEY_ID: "{{ lookup('env', 'AWS_ACCESS_KEY_ID', default='') }}"
  AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY', default='') }}"
