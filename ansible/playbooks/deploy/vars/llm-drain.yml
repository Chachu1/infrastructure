---
# Per-service vars for llm-drain (used by playbooks/deploy.yml).
#
# Pure Judge: polls `pending` rows from match_review_queue, asks OpenRouter,
# and writes decision_status. The Executor (group-materializer) is the only
# writer of product_groups. Mirrors playbooks/hosts/llm-drain.yml.

app_name: llm-drain
app_user: llm-drain
app_group: llm-drain
app_port: 8000
app_health_path: /health
app_health_port: 8000
app_health_check: "systemd"
# The loop idles instead of exiting when disabled or unkeyed; "always" keeps
# any unexpected exit coming back without a manual restart.
app_restart: always
app_working_dir: "/opt/llm-drain/current/pipelines/matcher"
app_requirements: "pipelines/matcher/requirements-drain.txt"
app_archive_paths: ["pipelines/matcher", "shared/python", "sql"]
app_repo_url: "https://github.com/Chachu1/Price_Tracker.git"
app_branch: main
app_keep_releases: 2
app_service_exec: "/opt/llm-drain/current/venv/bin/python -u llm/drain.py --loop --prompt-version v3 --cost-cap-usd 3.00"
app_env_vars:
  APP_ENV: production
  LLM_DRAIN_ENABLED: "true"
  LLM_DRAIN_DB_POOL: "16"
# Secrets are injected from GitHub Actions env at deploy time. Add/rename keys
# here to match the app's needs; empty values are written verbatim.
# OPENROUTER_MATCHER_KEY falls back to OPENROUTER_API_KEY for compatibility.
app_secrets:
  PG_DSN: "{{ lookup('env', 'PG_DSN') }}"
  OPENROUTER_MATCHER_KEY: "{{ lookup('env', 'OPENROUTER_MATCHER_KEY', default=lookup('env', 'OPENROUTER_API_KEY', default='')) }}"
