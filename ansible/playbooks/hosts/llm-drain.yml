---
# llm-drain - LLM judge for match_review_queue (native systemd + venv), LXC.
# Pure decision producer: reads `pending` rows, calls OpenRouter, writes
# accepted/rejected. Never writes product_groups (group-materializer does).
# Internal worker, no HTTP listener; health checked via systemd active.
# Run standalone: ansible-playbook playbooks/hosts/llm-drain.yml

- name: Bootstrap llm-drain
  hosts: llm-drain
  gather_facts: false
  tasks:
    - name: Wait for SSH
      wait_for_connection:
        timeout: 60

    - name: Install Python
      raw: which python3 || (apt-get update -qq || true; apt-get install -y -qq python3)
      changed_when: false

    - name: Gather facts
      setup:

- name: Configure llm-drain
  hosts: llm-drain
  vars:
    dns_configured: true
    app_name: llm-drain
    app_user: llm-drain
    app_group: llm-drain
    app_port: 8000
    app_health_path: /health
    app_health_port: 8000
    app_health_check: "systemd"
    app_working_dir: "/opt/llm-drain/current/pipelines/matcher"
    app_service_exec: "/opt/llm-drain/current/venv/bin/python -u llm/drain.py --loop --prompt-version v3 --cost-cap-usd 3.00"
    # The loop idles instead of exiting when disabled or unkeyed; "always"
    # keeps any unexpected exit coming back without a manual restart.
    app_restart: always
    app_env_vars:
      APP_ENV: production
      LLM_DRAIN_ENABLED: "true"
      LLM_DRAIN_DB_POOL: "16"
  pre_tasks:
    - name: Check distribution is supported
      assert:
        that:
          - ansible_distribution in ['Debian', 'Ubuntu']
        fail_msg: "app_systemd requires Debian or Ubuntu, got {{ ansible_distribution }} {{ ansible_distribution_version }}"
  roles:
    - common
    - app_systemd
