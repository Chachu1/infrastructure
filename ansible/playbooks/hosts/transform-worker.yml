---
# transform-worker - claims transform tasks from job-tracker-api (native systemd), LXC
# Internal worker, no HTTP listener; health checked via systemd active.
# Run standalone: ansible-playbook playbooks/hosts/transform-worker.yml

- name: Bootstrap transform-worker
  hosts: transform-worker
  gather_facts: false
  tasks:
    - name: Wait for SSH
      wait_for_connection:
        timeout: 60

    - name: Install Python
      raw: which python3 || (apt-get update -qq || true; apt-get install -y -qq python3)
      changed_when: false

    - name: Gather facts
      setup:

- name: Configure transform-worker
  hosts: transform-worker
  vars:
    dns_configured: true
    app_name: transform-worker
    app_user: transform-worker
    app_group: transform-worker
    app_port: 8000
    app_health_path: /health
    app_health_port: 8000
    app_health_check: "systemd"
    app_working_dir: "/opt/transform-worker/current/services/transform-worker"
    app_service_exec: "/opt/transform-worker/current/venv/bin/python -u worker.py"
    app_env_vars:
      APP_ENV: production
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_REGION: "us-east-1"
      SCRAPED_DATA_BUCKET: "price-tracker-data-751626788293-us-east-1"
      JT_POLL_INTERVAL: "10"
      JOB_TRACKER_URL: "http://job-tracker-api:8001"
  pre_tasks:
    - name: Check distribution is supported
      assert:
        that:
          - ansible_distribution in ['Debian', 'Ubuntu']
        fail_msg: "app_systemd requires Debian or Ubuntu, got {{ ansible_distribution }} {{ ansible_distribution_version }}"
  roles:
    - common
    - app_systemd
