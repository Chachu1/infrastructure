---
# graylog - log management server (Graylog + MongoDB + OpenSearch via Docker)
# Run standalone: ansible-playbook playbooks/hosts/graylog.yml

- name: Bootstrap graylog
  hosts: graylog
  gather_facts: false
  tasks:
    - name: Wait for SSH
      wait_for_connection:
        timeout: 60

    - name: Install Python
      raw: which python3 || (apt-get update -qq || true; apt-get install -y -qq python3)
      changed_when: false

    - name: Gather facts
      setup:

- name: Configure graylog
  hosts: graylog
  roles:
    - common
    - graylog
