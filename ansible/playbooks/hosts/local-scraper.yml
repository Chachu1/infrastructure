---
# local-scraper - patchright-based scraper worker (native systemd + LXC, Chromium).
# NO Docker. Chromium installed system-wide; patchright uses it.
# Internal worker, no HTTP listener; health checked via systemd active.
# Run standalone: ansible-playbook playbooks/hosts/local-scraper.yml

- name: Bootstrap local-scraper
  hosts: local-scraper
  gather_facts: false
  tasks:
    - name: Wait for SSH
      wait_for_connection:
        timeout: 60

    - name: Install Python
      raw: which python3 || (apt-get update -qq || true; apt-get install -y -qq python3)
      changed_when: false

    - name: Gather facts
      setup:

- name: Install Chromium system libraries
  hosts: local-scraper
  become: true
  tasks:
    - name: Install Chromium runtime deps
      apt:
        name:
          - libnss3
          - libnspr4
          - libatk1.0-0
          - libatk-bridge2.0-0
          - libcups2
          - libdrm2
          - libdbus-1-3
          - libxkbcommon0
          - libxcomposite1
          - libxdamage1
          - libxfixes3
          - libxrandr2
          - libgbm1
          - libpango-1.0-0
          - libcairo2
          - libasound2
        state: present
        update_cache: yes

- name: Configure local-scraper
  hosts: local-scraper
  vars:
    dns_configured: true
    app_name: local-scraper
    app_user: local-scraper
    app_group: local-scraper
    app_port: 8000
    app_health_path: /health
    app_health_port: 8000
    app_health_check: "systemd"
    app_working_dir: "/opt/local-scraper/current/coolify/local-scraper"
    app_service_exec: "/opt/local-scraper/current/venv/bin/python -u worker.py"
    app_browser: true
    app_env_vars:
      APP_ENV: production
      AWS_DEFAULT_REGION: "us-east-1"
      JT_POLL_INTERVAL: "15"
      JOB_TRACKER_URL: "http://job-tracker-api:8001"
      LOCAL_SCRAPE_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/751626788293/price-tracker-local-scrape-queue"
      SCRAPED_DATA_BUCKET: "price-tracker-data-751626788293-us-east-1"
  pre_tasks:
    - name: Check distribution is supported
      assert:
        that:
          - ansible_distribution in ['Debian', 'Ubuntu']
        fail_msg: "app_systemd requires Debian or Ubuntu, got {{ ansible_distribution }} {{ ansible_distribution_version }}"
  roles:
    - common
    - app_systemd
