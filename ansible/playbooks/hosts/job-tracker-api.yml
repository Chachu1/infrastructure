---
# job-tracker-api - orchestration + scheduler API (native systemd + venv), LXC
# Serves jobs.mhlab.me after cutover. Currently still on Coolify (10.0.0.60);
# this LXC runs in parallel until domain cutover (PRD §8).
# Run standalone: ansible-playbook playbooks/hosts/job-tracker-api.yml

- name: Bootstrap job-tracker-api
  hosts: job-tracker-api
  gather_facts: false
  tasks:
    - name: Wait for SSH
      wait_for_connection:
        timeout: 60

    - name: Install Python
      raw: which python3 || (apt-get update -qq || true; apt-get install -y -qq python3)
      changed_when: false

    - name: Gather facts
      setup:

- name: Configure job-tracker-api
  hosts: job-tracker-api
  vars:
    dns_configured: true
    app_name: job-tracker-api
    app_user: job-tracker-api
    app_group: job-tracker-api
    app_port: 8001
    app_health_path: /health
    app_health_port: 8001
    app_health_check: "http"
    app_working_dir: "/opt/job-tracker-api/current/coolify/job-tracker-api"
    app_service_exec: "/opt/job-tracker-api/current/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8001"
    app_env_vars:
      APP_ENV: production
      APP_PORT: "8001"
      SCHEDULER_ENABLED: "true"
  pre_tasks:
    - name: Check distribution is supported
      assert:
        that:
          - ansible_distribution in ['Debian', 'Ubuntu']
        fail_msg: "app_systemd requires Debian or Ubuntu, got {{ ansible_distribution }} {{ ansible_distribution_version }}"
  roles:
    - common
    - app_systemd
