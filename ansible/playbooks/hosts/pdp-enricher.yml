---
# pdp-enricher - LLM enrichment worker (native systemd + venv), LXC.
# Reads PDP JSON from S3, calls OpenRouter to fill spec gaps, writes back to PG.
# No browser/Chromium needed. Internal worker, no HTTP listener; health checked
# via systemd active.
# Run standalone: ansible-playbook playbooks/hosts/pdp-enricher.yml

- name: Bootstrap pdp-enricher
  hosts: pdp-enricher
  gather_facts: false
  tasks:
    - name: Wait for SSH
      wait_for_connection:
        timeout: 60

    - name: Install Python
      raw: which python3 || (apt-get update -qq || true; apt-get install -y -qq python3)
      changed_when: false

    - name: Gather facts
      setup:

- name: Configure pdp-enricher
  hosts: pdp-enricher
  vars:
    dns_configured: true
    app_name: pdp-enricher
    app_user: pdp-enricher
    app_group: pdp-enricher
    app_port: 8000
    app_health_path: /health
    app_health_port: 8000
    app_health_check: "systemd"
    app_working_dir: "/opt/pdp-enricher/current"
    app_service_exec: "/opt/pdp-enricher/current/venv/bin/python -u workers/pdp-enricher/worker.py"
  pre_tasks:
    - name: Check distribution is supported
      assert:
        that:
          - ansible_distribution in ['Debian', 'Ubuntu']
        fail_msg: "app_systemd requires Debian or Ubuntu, got {{ ansible_distribution }} {{ ansible_distribution_version }}"
  roles:
    - common
    - app_systemd
