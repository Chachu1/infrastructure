---
# pvl-verifier - PVL price-verification worker (issue #106), native systemd + LXC.
# NO Docker. Chromium installed system-wide; Playwright uses it.
# Internal worker, no HTTP listener; health checked via systemd active.
# Run standalone: ansible-playbook playbooks/hosts/pvl-verifier.yml

- name: Bootstrap pvl-verifier
  hosts: pvl-verifier
  gather_facts: false
  tasks:
    - name: Wait for SSH
      wait_for_connection:
        timeout: 60

    - name: Install Python
      raw: which python3 || (apt-get update -qq || true; apt-get install -y -qq python3)
      changed_when: false

    - name: Gather facts
      setup:

- name: Install Chromium system libraries
  hosts: pvl-verifier
  become: true
  tasks:
    - name: Install Chromium runtime deps
      apt:
        name:
          - libnss3
          - libnspr4
          - libatk1.0-0
          - libatk-bridge2.0-0
          - libcups2
          - libdrm2
          - libdbus-1-3
          - libxkbcommon0
          - libxcomposite1
          - libxdamage1
          - libxfixes3
          - libxrandr2
          - libgbm1
          - libpango-1.0-0
          - libcairo2
          - libasound2
        state: present
        update_cache: yes

- name: Configure pvl-verifier
  hosts: pvl-verifier
  vars:
    dns_configured: true
    app_name: pvl-verifier
    app_user: pvl-verifier
    app_group: pvl-verifier
    app_port: 8000
    app_health_path: /health
    app_health_port: 8000
    app_health_check: "systemd"
    app_working_dir: "/opt/pvl-verifier/current/services/pvl-verifier"
    app_service_exec: "/opt/pvl-verifier/current/venv/bin/python -u worker.py"
    app_browser: true
    app_env_vars:
      APP_ENV: production
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_REGION: "us-east-1"
      PVL_PROOF_BUCKET: "price-tracker-screenshots-751626788293-us-east-1"
      PDP_DATA_BUCKET: "price-tracker-data-751626788293-us-east-1"
      PVL_POLL_SECONDS: "15"
      PVL_BATCH_SIZE: "5"
      PVL_WORKER_NAME: "pvl-verifier"
      PVL_PROXY_URL: "socks5://192.168.1.207:1080"
      PVL_PROXY_RETAILERS: "SharafDG,Swas,Emax"
  pre_tasks:
    - name: Check distribution is supported
      assert:
        that:
          - ansible_distribution in ['Debian', 'Ubuntu']
        fail_msg: "app_systemd requires Debian or Ubuntu, got {{ ansible_distribution }} {{ ansible_distribution_version }}"
  roles:
    - common
    - app_systemd
