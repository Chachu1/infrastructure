---
# carrefour-scraper - dedicated local-scraper for Carrefour (Akamai-protected).
#
# Runs the same services/local-scraper code as local-scraper, but headed under
# Xvfb because Carrefour detects and rejects headless browsers. It polls its
# own SQS queue (price-tracker-carrefour-scrape-queue) so Carrefour traffic
# never competes with the Swas local scraper.
#
# NO Docker. Chromium installed system-wide; patchright uses it.
# Internal worker, no HTTP listener; health checked via systemd active.
# Run standalone: ansible-playbook playbooks/hosts/carrefour-scraper.yml

- name: Bootstrap carrefour-scraper
  hosts: carrefour-scraper
  gather_facts: false
  tasks:
    - name: Wait for SSH
      wait_for_connection:
        timeout: 60

    - name: Install Python
      raw: which python3 || (apt-get update -qq || true; apt-get install -y -qq python3)
      changed_when: false

    - name: Gather facts
      setup:

- name: Install Chromium and virtual-display libraries
  hosts: carrefour-scraper
  become: true
  tasks:
    - name: Install Chromium + Xvfb runtime deps
      apt:
        name:
          - xvfb
          - x11-utils
          - libnss3
          - libnspr4
          - libatk1.0-0
          - libatk-bridge2.0-0
          - libcups2
          - libdrm2
          - libdbus-1-3
          - libxkbcommon0
          - libxkbcommon-x11-0
          - libxcomposite1
          - libxdamage1
          - libxfixes3
          - libxrandr2
          - libgbm1
          - libpango-1.0-0
          - libcairo2
          - libasound2
          - libgtk-3-0
          - libxss1
          - libxtst6
          - libx11-xcb1
          - libxcb1
        state: present
        update_cache: yes

- name: Configure carrefour-scraper
  hosts: carrefour-scraper
  vars:
    dns_configured: true
    app_name: carrefour-scraper
    app_user: carrefour-scraper
    app_group: carrefour-scraper
    app_port: 8000
    app_health_path: /health
    app_health_port: 8000
    app_health_check: "systemd"
    app_working_dir: "/opt/carrefour-scraper/current/services/local-scraper"
    # Headed scrape under a virtual display; the worker uses BROWSER_HEADLESS=false.
    app_service_exec: "xvfb-run -a /opt/carrefour-scraper/current/venv/bin/python -u worker.py"
    app_browser: true
    app_env_vars:
      APP_ENV: production
      AWS_DEFAULT_REGION: "us-east-1"
      JT_POLL_INTERVAL: "15"
      JOB_TRACKER_URL: "http://job-tracker-api:8001"
      LOCAL_SCRAPE_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/751626788293/price-tracker-carrefour-scrape-queue"
      SCRAPED_DATA_BUCKET: "price-tracker-data-751626788293-us-east-1"
      BROWSER_HEADLESS: "false"
  pre_tasks:
    - name: Check distribution is supported
      assert:
        that:
          - ansible_distribution in ['Debian', 'Ubuntu']
        fail_msg: "app_systemd requires Debian or Ubuntu, got {{ ansible_distribution }} {{ ansible_distribution_version }}"
  roles:
    - common
    - app_systemd
