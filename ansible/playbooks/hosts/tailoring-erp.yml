---
# tailoring-erp - tailoring shop ERP (Flask + waitress + SQLite), native LXC.
# Serves tailor.mhlab.me through the gateway Caddy.
# Run standalone: ansible-playbook playbooks/hosts/tailoring-erp.yml

- name: Bootstrap tailoring-erp
  hosts: tailoring-erp
  gather_facts: false
  tasks:
    - name: Wait for SSH
      wait_for_connection:
        timeout: 60

    - name: Install Python
      raw: which python3 || (apt-get update -qq || true; apt-get install -y -qq python3)
      changed_when: false

    - name: Gather facts
      setup:

- name: Configure tailoring-erp
  hosts: tailoring-erp
  vars:
    dns_configured: true
    app_name: tailoring-erp
    app_user: tailoring-erp
    app_group: tailoring-erp
    app_port: 8004
    app_health_path: /health
    app_health_port: 8004
    app_health_check: "http"
    app_working_dir: "/opt/tailoring-erp/current"
    app_service_exec: "/opt/tailoring-erp/current/venv/bin/waitress-serve --listen=0.0.0.0:8004 wsgi:app"
    app_env_vars:
      APP_ENV: production
      # SQLite database + daily backups live outside the release dir, which is
      # pruned on every deploy.
      TAILOR_ERP_DATA_DIR: "/opt/tailoring-erp/shared"
  pre_tasks:
    - name: Check distribution is supported
      assert:
        that:
          - ansible_distribution in ['Debian', 'Ubuntu']
        fail_msg: "app_systemd requires Debian or Ubuntu, got {{ ansible_distribution }} {{ ansible_distribution_version }}"
  roles:
    - common
    - app_systemd
