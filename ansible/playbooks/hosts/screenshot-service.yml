---
# screenshot-service + screenshot-monitor - Chromium capture (native systemd + LXC).
# NO Docker: Chromium is installed system-wide on the LXC and Playwright uses it.
# screenshot-service serves :8010, monitor proxies on :8011 (same LXC).
# Run standalone: ansible-playbook playbooks/hosts/screenshot-service.yml

- name: Bootstrap screenshot-service
  hosts: screenshot-service
  gather_facts: false
  tasks:
    - name: Wait for SSH
      wait_for_connection:
        timeout: 60

    - name: Install Python
      raw: which python3 || (apt-get update -qq || true; apt-get install -y -qq python3)
      changed_when: false

    - name: Gather facts
      setup:

- name: Install Chromium system libraries
  hosts: screenshot-service
  become: true
  tasks:
    - name: Install Chromium runtime deps
      apt:
        name:
          - libnss3
          - libnspr4
          - libatk1.0-0
          - libatk-bridge2.0-0
          - libcups2
          - libdrm2
          - libdbus-1-3
          - libxkbcommon0
          - libxcomposite1
          - libxdamage1
          - libxfixes3
          - libxrandr2
          - libgbm1
          - libpango-1.0-0
          - libcairo2
          - libasound2
        state: present
        update_cache: yes

- name: Configure screenshot-service
  hosts: screenshot-service
  vars:
    dns_configured: true
    app_name: screenshot-service
    app_user: screenshot-service
    app_group: screenshot-service
    app_port: 8010
    app_health_path: /health
    app_health_port: 8010
    app_health_check: "http"
    app_working_dir: "/opt/screenshot-service/current/coolify/screenshot-service"
    app_service_exec: "/opt/screenshot-service/current/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8010"
    app_browser: true
    app_env_vars:
      APP_ENV: production
      APP_PORT: "8010"
      SCREENSHOT_WORKER_ENABLED: "true"
  pre_tasks:
    - name: Check distribution is supported
      assert:
        that:
          - ansible_distribution in ['Debian', 'Ubuntu']
        fail_msg: "app_systemd requires Debian or Ubuntu, got {{ ansible_distribution }} {{ ansible_distribution_version }}"
  roles:
    - common
    - app_systemd
