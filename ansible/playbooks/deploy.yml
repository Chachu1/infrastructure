---
# Generic immutable-release deploy for systemd app LXCs.
# Usage: ansible-playbook playbooks/deploy.yml -e service=categorizer -e sha=<commit-sha>
# (or export DEPLOY_SHA and SERVICE and omit -e sha).
#
# Hosts the playbook targets is the inventory host/group named by `service`
# (categorizer, review-api, ...). Per-service app vars live in
# playbooks/deploy/vars/<service>.yml.

- name: Deploy {{ service }}
  hosts: "{{ service | default(lookup('env', 'SERVICE') | default('categorizer', true)) }}"
  vars_files:
    - "deploy/vars/{{ service | default(lookup('env', 'SERVICE') | default('categorizer', true)) }}.yml"
  vars:
    service: "{{ lookup('env', 'SERVICE', default='categorizer') }}"
    sha: "{{ lookup('env', 'DEPLOY_SHA', default='') }}"
    # Read-only repo-scoped deploy keys. No PAT is stored in the LXC.
    app_deploy_key: >-
      {{ lookup('env', 'TAILORING_SYSTEM_DEPLOY_KEY', default='')
         if 'tailoring-system' in app_repo_url
         else lookup('env', 'PRICE_TRACKER_DEPLOY_KEY', default='') }}
    repo_ssh_url: "{{ app_repo_url | replace('https://github.com/', 'git@github.com:') }}"
    git_ssh_command: "ssh -i /opt/{{ service }}/shared/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

  tasks:
    - name: Require a commit SHA
      fail:
        msg: "Provide the commit SHA to deploy via -e sha=<commit-sha> (or set DEPLOY_SHA)"
      when: sha | length == 0

    - block:
        # --- Lock: serialize deploys against maintenance runs ---
        - name: Check deploy lock
          stat:
            path: "/tmp/deploy-{{ service }}.lock"
          register: deploy_lock

        - name: Fail if a deploy is already running
          fail:
            msg: "A deploy for {{ service }} is already running ({{ deploy_lock.stat.path }} present)"
          when: deploy_lock.stat.exists

        - name: Create deploy lock
          file:
            path: "/tmp/deploy-{{ service }}.lock"
            state: touch
          register: deploy_lock_created

        - name: Check free space before building a release
          command: df --output=avail -B1 /
          register: deploy_free_space
          changed_when: false
          check_mode: false

        - name: Require at least 2 GiB free on /
          assert:
            that:
              - deploy_free_space.stdout_lines[-1] | int > 2147483648
            fail_msg: "Less than 2 GiB free on /; run the disk cleanup before deploying."

        # --- Refresh unit + env from current vars (idempotent) ---
        - name: Require PG_DSN
          fail:
            msg: "PG_DSN is empty - set secrets.PG_DSN in Chachu1/infrastructure (single DSN for all services)"
          when:
            - app_requires_pg | default(true)
            - lookup('env', 'PG_DSN') | length == 0

        - name: Refresh systemd unit and env file
          include_role:
            name: app_systemd
          vars:
            app_force_env: true

        # --- Release deploy ---
        - name: Set release facts
          set_fact:
            release_dir: "/opt/{{ service }}/releases/{{ sha }}"
            repo_bare: "/opt/{{ service }}/shared/repo.git"

        - name: Require a repository deploy key
          fail:
            msg: >-
              No deploy key for {{ service }}. Set
              {{ 'TAILORING_SYSTEM_DEPLOY_KEY' if 'tailoring-system' in app_repo_url else 'PRICE_TRACKER_DEPLOY_KEY' }}
              in the infrastructure GitHub secrets.
          when: app_deploy_key | length == 0

        - name: Ensure the deploy key directory exists
          file:
            path: "/opt/{{ service }}/.ssh"
            state: directory
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
            mode: "0700"
          become: true

        - name: Install the repository deploy key
          copy:
            content: "{{ app_deploy_key }}\n"
            dest: "/opt/{{ service }}/shared/deploy_key"
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
            mode: "0600"
          become: true
          no_log: true
          when: app_deploy_key | length > 0

        - name: Check if release already exists
          stat:
            path: "{{ release_dir }}"
          register: release_stat

        # A previous deploy can leave the release directory behind without a
        # usable venv (e.g. it failed during dependency installation). Treat
        # that as incomplete instead of skipping the build forever.
        - name: Check if release venv is already built
          stat:
            path: "{{ release_dir }}/venv/bin/python"
          register: release_venv_stat

        - name: Remove invalid bare repo left by previous failed clone
          shell: "if [ -d {{ repo_bare }} ] && ! git --git-dir={{ repo_bare }} rev-parse --is-bare-repository >/dev/null 2>&1; then rm -rf {{ repo_bare }}; echo removed; else echo ok; fi"
          changed_when: false
          become: true
          become_user: "{{ app_user }}"

        - name: Ensure bare clone of app repo exists
          command: "git clone --bare --branch {{ app_branch }} {{ repo_ssh_url }} {{ repo_bare }}"
          args:
            creates: "{{ repo_bare }}"
          environment:
            GIT_SSH_COMMAND: "{{ git_ssh_command }}"
          become: true
          become_user: "{{ app_user }}"
          no_log: true

        - name: Point the bare repo at the SSH remote
          command: "git --git-dir={{ repo_bare }} remote set-url origin {{ repo_ssh_url }}"
          changed_when: false
          become: true
          become_user: "{{ app_user }}"

        - name: Fetch latest refs
          command: "git --git-dir={{ repo_bare }} fetch origin --tags --prune '+refs/heads/*:refs/heads/*'"
          environment:
            GIT_SSH_COMMAND: "{{ git_ssh_command }}"
          changed_when: false
          become: true
          become_user: "{{ app_user }}"

        - name: Verify commit exists
          command: "git --git-dir={{ repo_bare }} rev-parse --verify --quiet '{{ sha }}^{commit}'"
          register: sha_verify
          changed_when: false
          failed_when: sha_verify.rc != 0
          become: true
          become_user: "{{ app_user }}"

        - name: Export release from git archive
          shell: |
            set -euo pipefail
            mkdir -p "{{ release_dir }}"
            paths="{{ app_archive_paths | default([]) | join(' ') }}"
            if [ -n "$paths" ]; then
              git --git-dir="{{ repo_bare }}" archive "{{ sha }}" -- $paths | tar -x -C "{{ release_dir }}"
            else
              git --git-dir="{{ repo_bare }}" archive "{{ sha }}" | tar -x -C "{{ release_dir }}"
            fi
          args:
            executable: /bin/bash
          when: not release_stat.stat.exists
          become: true
          become_user: "{{ app_user }}"

        - name: Build release venv
          shell: |
            set -eu
            cd "{{ release_dir }}"
            uv venv venv
            REQS="{{ app_requirements | default('requirements.txt') }}"
            if [ ! -f "$REQS" ]; then
              echo "requirements file $REQS not found in release" >&2
              exit 1
            fi
            uv pip install --python venv/bin/python -r "$REQS"
            # Install shared lib if present and not already installed via requirements
            if [ -d shared/python ] && [ -f shared/python/pyproject.toml ]; then
              uv pip install --python venv/bin/python -e shared/python || true
            fi
          when: not release_venv_stat.stat.exists and (app_runtime | default('python')) == 'python'
          become: true
          become_user: "{{ app_user }}"

        - name: Install Chromium for browser services (no Docker)
          shell: |
            cd {{ release_dir }}
            ./venv/bin/python -m playwright install chromium
            ./venv/bin/python -m playwright install-deps chromium || true
            ./venv/bin/python -m patchright install chromium || true
          when: not release_venv_stat.stat.exists and (app_browser | default(false))
          become: true
          become_user: "{{ app_user }}"

        - name: Build Node release (frontend)
          shell: |
            cd {{ release_dir }}/{{ app_node_dir | default('.') }}
            set -a
            . /etc/{{ service }}/env 2>/dev/null || true
            set +a
            unset NODE_ENV
            npm ci
            npm run build
          when: not release_stat.stat.exists and (app_runtime | default('python')) == 'node'
          become: true
          become_user: "{{ app_user }}"

        - name: Create new current symlink
          command: "ln -sfn {{ release_dir }} /opt/{{ service }}/current.new"
          become: true

        - name: Atomically swap current symlink
          command: "mv -Tf /opt/{{ service }}/current.new /opt/{{ service }}/current"
          become: true

        - name: Reload systemd
          systemd:
            daemon_reload: true
          become: true

        - name: Restart {{ service }} service
          systemd:
            name: "{{ service }}.service"
            state: restarted
            enabled: true
          become: true

        - name: Restart extra units
          systemd:
            name: "{{ item.name }}.service"
            state: restarted
            enabled: true
          become: true
          loop: "{{ app_extra_units | default([]) }}"

        - name: Wait for health endpoint (http)
          uri:
            url: "http://127.0.0.1:{{ app_health_port }}{{ app_health_path }}"
            status_code: 200
          register: health
          until: health.status == 200
          retries: 30
          delay: 2
          changed_when: false
          become: true
          when: app_health_check | default('http') == 'http'

        - name: Wait for systemd service active (worker)
          systemd:
            name: "{{ service }}.service"
          register: svc_status
          until: svc_status.status.ActiveState == "active"
          retries: 15
          delay: 2
          become: true
          when: app_health_check | default('http') != 'http'

        - name: Wait for extra units active (worker)
          shell: |
            for u in {{ app_extra_units | map(attribute='name') | join(' ') }}; do
              systemctl is-active --quiet "$u.service" || exit 1
            done
          register: extra_active
          until: extra_active.rc == 0
          retries: 15
          delay: 2
          changed_when: false
          become: true
          when: app_extra_units | default([]) | length > 0

        - name: Clean build caches after a successful deploy
          block:
            - name: Run post-deploy cleanup
              include_role:
                name: app_maintenance
                tasks_from: deploy.yml
              vars:
                app_maintenance_check_deploy_lock: false
                app_maintenance_dry_run: false
          rescue:
            - name: Warn that post-deploy cleanup failed
              debug:
                msg: "Post-deploy cleanup failed; the deploy itself is healthy. Check the log above."

      always:
        # Only clean up if this run owned the lock. If the lock already existed
        # (another deploy is in flight), this block must not touch releases.
        - name: Prune old and incomplete releases
          when: deploy_lock_created is defined and deploy_lock_created.changed
          block:
            - name: Run release cleanup
              include_role:
                name: app_maintenance
                tasks_from: releases.yml
              vars:
                app_maintenance_check_deploy_lock: false
                app_maintenance_dry_run: false
                app_maintenance_keep_releases: "{{ app_keep_releases | default(2) }}"
          rescue:
            - name: Warn that release cleanup failed
              debug:
                msg: "Release cleanup failed; check /opt/{{ service }}/releases manually."

        - name: Release deploy lock
          file:
            path: "/tmp/deploy-{{ service }}.lock"
            state: absent
          when: deploy_lock_created is defined and deploy_lock_created.changed
