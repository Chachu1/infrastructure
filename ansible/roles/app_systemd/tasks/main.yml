---
# app_systemd - provision a native systemd application container.
# Creates the app user, directory layout, env file, systemd unit and a helper
# deploy script. Idempotent.

- name: Create application group
  group:
    name: "{{ app_group }}"
    system: true

- name: Create application user
  user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "/opt/{{ app_name }}"
    create_home: false

- name: Create application directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  loop:
    - "/opt/{{ app_name }}"
    - "/opt/{{ app_name }}/releases"
    - "/opt/{{ app_name }}/shared"

- name: Create config directory
  file:
    path: "/etc/{{ app_name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create log directory
  file:
    path: "/var/log/{{ app_name }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Install Python runtime packages
  apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - git
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Install uv
  shell: curl -LsSf https://astral.sh/uv/install.sh | UV_INSTALL_DIR=/usr/local/bin sh
  args:
    creates: /usr/local/bin/uv

- name: Render app env file
  template:
    src: env.j2
    dest: "/etc/{{ app_name }}/env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"

- name: Render systemd unit
  template:
    src: app.service.j2
    dest: "/etc/systemd/system/{{ app_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: restart {{ app_name }}

- name: Render deploy helper script
  template:
    src: deploy-app.sh.j2
    dest: "/usr/local/bin/deploy-{{ app_name }}.sh"
    owner: root
    group: root
    mode: "0755"

- name: Check whether an application release is installed
  stat:
    path: "/opt/{{ app_name }}/current"
  register: app_current

- name: Reload systemd and enable service
  systemd:
    name: "{{ app_name }}.service"
    state: "{{ 'started' if app_current.stat.exists else 'stopped' }}"
    enabled: true
    daemon_reload: true

- name: Ensure env file ownership and permissions
  include_role:
    name: app_secrets
