---
# Generic native-systemd application role.
# Provisioning only: creates the user/dirs/service skeleton. The actual
# release is deployed by playbooks/deploy.yml (or the helper script
# /usr/local/bin/deploy-{{ app_name }}.sh) on an immutable-release basis.

app_name: "app"
app_user: "{{ app_name }}"
app_group: "{{ app_name }}"
app_deploy_user: "{{ app_user }}"

app_port: 8000
app_health_path: "/health"
app_health_port: "{{ app_port }}"

app_repo_url: "https://github.com/Chachu1/Price_Tracker.git"
app_branch: "main"
app_keep_releases: 3

# Non-secret environment for the app (rendered into /etc/{{ app_name }}/env).
app_env_vars: {}

# deploy.yml force-renders the env file (it owns secret delivery); site.yml
# only creates it if absent so provisioning never clobbers deployed secrets.
app_force_env: false

# Secret environment, normally populated per-service from GH secrets via
# lookup('env', ...). app_secrets role keeps the rendered file permissions sane.
app_secrets: {}

# Extra OS packages the app needs (e.g. xvfb + Chromium libs for a headed
# browser worker). Installed during provisioning and on every deploy, so a
# service deploy is self-contained and does not depend on site.yml.
app_packages: []

# Merged env written to /etc/{{ app_name }}/env (app_env_vars win over secrets
# on key collisions).
app_env: "{{ app_env_vars | combine(app_secrets) }}"

# ExecStart for the systemd unit. Override per host/service - e.g.
# "/opt/categorizer/current/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port {{ app_port }}"
app_service_exec: "/opt/{{ app_name }}/current/venv/bin/python -m app"

# WorkingDirectory for the systemd unit. Override per-service when the
# app's entrypoint lives in a subdirectory (e.g. coolify/review-api).
app_working_dir: "/opt/{{ app_name }}/current"

# Health check mode: http (curl /health) or systemd (check service active).
# Workers like categorizer have no HTTP endpoint.
app_health_check: "http"

# systemd restart policy for the unit. "always" keeps worker processes that
# exit cleanly coming back (e.g. a self-recycling browser worker); the default
# "on-failure" suits web services that should stay down on a clean exit.
app_restart: "on-failure"

# Optional cgroup memory limits for the unit (systemd MemoryHigh/MemoryMax).
# Empty disables. Use "2G"/"3G" style values to bound a leaking worker before
# it saturates the container cgroup.
app_memory_high: ""
app_memory_max: ""

# Optional additional systemd units to provision on the same host (e.g. a
# second worker running from the same release). Each entry is a dict:
#   name, description, working_dir, exec, restart, memory_high, memory_max,
#   env (non-secret), env_secrets (secret).
app_extra_units: []

# systemd watchdog (optional). When set (e.g. "15m"), the unit gets WatchdogSec=
# and the app must send WATCHDOG=1 pings via NOTIFY_SOCKET or systemd restarts
# it. Only enable for workers that implement _sd_watchdog_ping().
app_watchdog_sec: ""

app_description: "{{ app_name }} service"