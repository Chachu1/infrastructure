---
# app_docker - provision a Docker-compose based application container.
# Includes the docker_host role for the Docker engine, then deploys the app's
# compose stack from a per-app directory. Browser-only services (Docker-in-LXC)
# should pass security_opt apparmor:unconfined in their compose file.

- name: Install Docker engine
  include_role:
    name: docker_host

- name: Create application user and group
  group:
    name: "{{ app_group }}"
    system: true

- name: Create application user
  user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "/opt/{{ app_name }}"
    create_home: false

- name: Create application directories
  file:
    path: "/opt/{{ app_name }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Create config directory
  file:
    path: "/etc/{{ app_name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render compose env file
  template:
    src: env.j2
    dest: "/etc/{{ app_name }}/env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"

- name: Render docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "/opt/{{ app_name }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Ensure Docker service is running
  systemd:
    name: docker
    state: started
    enabled: true