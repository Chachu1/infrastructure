---
# WireGuard role - VPN client connecting to home network

- name: Install WireGuard and iptables
  apt:
    name:
      - wireguard
      - wireguard-tools
      - iptables
    state: present

- name: Set WireGuard private key from environment
  set_fact:
    wireguard_client_private_key: "{{ lookup('env', 'WIREGUARD_PRIVATE_KEY') }}"
  no_log: true

- name: Deploy WireGuard configuration
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  notify: restart wireguard

- name: Enable WireGuard service
  systemd:
    name: wg-quick@wg0
    state: started
    enabled: yes
  ignore_errors: yes

- name: Deploy WireGuard DNS check script
  template:
    src: wireguard-dns-check.sh.j2
    dest: /usr/local/bin/wireguard-dns-check.sh
    mode: "0755"

- name: Install dnsutils for dig
  apt:
    name: dnsutils
    state: present

- name: Add cron job for WireGuard DNS re-resolution
  copy:
    dest: /etc/cron.d/wireguard-dns-check
    content: |
      */5 * * * * root /usr/local/bin/wireguard-dns-check.sh
    mode: "0644"
