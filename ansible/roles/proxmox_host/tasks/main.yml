---
- name: Create APT keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add HashiCorp GPG key
  shell:
    cmd: curl -fsSL https://apt.releases.hashicorp.com/gpg -o /etc/apt/keyrings/hashicorp.asc

- name: Remove legacy HashiCorp keyring
  file:
    path: /usr/share/keyrings/hashicorp-archive-keyring.gpg
    state: absent

- name: Configure HashiCorp APT source
  copy:
    dest: /etc/apt/sources.list.d/hashicorp.list
    content: "deb [signed-by=/etc/apt/keyrings/hashicorp.asc] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main\n"
    owner: root
    group: root
    mode: "0644"

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Deploy cloud image update script
  ansible.builtin.copy:
    src: update-cloud-images.sh
    dest: /usr/local/bin/update-cloud-images.sh
    mode: "0755"

- name: Deploy systemd service unit
  ansible.builtin.copy:
    src: update-cloud-images.service
    dest: /etc/systemd/system/update-cloud-images.service

- name: Deploy systemd timer unit
  ansible.builtin.copy:
    src: update-cloud-images.timer
    dest: /etc/systemd/system/update-cloud-images.timer

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start cloud image update timer
  ansible.builtin.systemd:
    name: update-cloud-images.timer
    enabled: true
    state: started

- name: Deploy LXC disk health script
  ansible.builtin.copy:
    src: lxc-disk-health.sh
    dest: /usr/local/bin/lxc-disk-health.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy LXC disk health environment
  ansible.builtin.template:
    src: lxc-disk-health.env.j2
    dest: /etc/lxc-disk-health.env
    owner: root
    group: root
    mode: "0600"

- name: Deploy LXC disk health service
  ansible.builtin.copy:
    src: lxc-disk-health.service
    dest: /etc/systemd/system/lxc-disk-health.service
    owner: root
    group: root
    mode: "0644"

- name: Deploy LXC disk health timer
  ansible.builtin.copy:
    src: lxc-disk-health.timer
    dest: /etc/systemd/system/lxc-disk-health.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable and start LXC disk health timer
  ansible.builtin.systemd:
    name: lxc-disk-health.timer
    enabled: true
    state: started
    daemon_reload: true
  # In check mode the unit files above are not actually written, so systemd
  # cannot resolve the unit yet.
  when: not ansible_check_mode

- name: Install iptables-persistent
  apt:
    name: iptables-persistent
    state: present

- name: Ensure DNAT rules exist
  shell: |
    set -e
    rules() {
      iptables -t nat -C PREROUTING -i eno1 -p tcp --dport 80 -j DNAT --to-destination {{ gateway_ip }}:80 2>/dev/null || \
        iptables -t nat -A PREROUTING -i eno1 -p tcp --dport 80 -j DNAT --to-destination {{ gateway_ip }}:80
      iptables -t nat -C PREROUTING -i eno1 -p tcp --dport 443 -j DNAT --to-destination {{ gateway_ip }}:443 2>/dev/null || \
        iptables -t nat -A PREROUTING -i eno1 -p tcp --dport 443 -j DNAT --to-destination {{ gateway_ip }}:443
      iptables -t nat -C PREROUTING -i eno1 -p udp --dport 51820 -j DNAT --to-destination {{ gateway_ip }}:51820 2>/dev/null || \
        iptables -t nat -A PREROUTING -i eno1 -p udp --dport 51820 -j DNAT --to-destination {{ gateway_ip }}:51820
      iptables -t nat -C POSTROUTING -s {{ private_subnet }} -o eno1 -j MASQUERADE 2>/dev/null || \
        iptables -t nat -A POSTROUTING -s {{ private_subnet }} -o eno1 -j MASQUERADE
    }
    rules
    iptables-save > /etc/iptables/rules.v4
  changed_when: false

# OpenSearch (used by the Graylog LXC) requires a high mmap limit. This is a
# host-level kernel tunable that unprivileged LXCs inherit, so setting it once
# on the Proxmox host covers the graylog container.
- name: Set vm.max_map_count for OpenSearch/Graylog
  sysctl:
    name: vm.max_map_count
    value: "262144"
    sysctl_set: yes
    state: present
    reload: yes
